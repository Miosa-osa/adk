[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miosa-adk"
version = "1.0.0"
description = "Official Python Agent Development Kit for MIOSA — build LLM agents that natively use MIOSA sandboxes, desktop computers, and deployments with the tool-call loop pre-wired."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MIOSA", email = "hello@miosa.ai" },
]
keywords = [
    "miosa",
    "adk",
    "agents",
    "ai-agents",
    "llm",
    "sandbox",
    "firecracker",
    "computer-use",
    "tool-calling",
    "ai-app-builder",
    "lovable",
    "claude",
    "openai",
    "anthropic",
    "groq",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
]

[project.optional-dependencies]
miosa = [
    "miosa>=1.0.0",
]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://miosa.ai"
Documentation = "https://miosa.ai/docs/adk"
Repository = "https://github.com/Miosa-osa/adk"
Issues = "https://github.com/Miosa-osa/adk/issues"
Changelog = "https://github.com/Miosa-osa/adk/blob/main/CHANGELOG.md"
Source = "https://github.com/Miosa-osa/adk"

[tool.hatch.build.targets.wheel]
packages = ["src/miosa_adk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
