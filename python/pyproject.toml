[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miosa-adk"
version = "0.1.0"
description = "Python Agent Development Kit for MIOSA sandboxes and builder products"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MIOSA", email = "hello@miosa.ai" },
]
keywords = [
    "miosa",
    "adk",
    "agents",
    "sandboxes",
    "ai-app-builder",
    "lovable",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Miosa-osa/adk"
Documentation = "https://github.com/Miosa-osa/adk/tree/main/python"
Repository = "https://github.com/Miosa-osa/adk"

[tool.hatch.build.targets.wheel]
packages = ["src/miosa_adk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
