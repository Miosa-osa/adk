name: Publish Python ADK

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

jobs:
  publish:
    name: Build and publish miosa-adk
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check Python ADK
        working-directory: python
        run: |
          uv run --extra dev ruff check src examples
          uv run --extra dev mypy src/miosa_adk
          uv run python -m compileall src/miosa_adk examples

      - name: Build distributions
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
